name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Validate data contract
        run: node scripts/validate.mjs

      - name: Unit tests (data pipeline / assistant core / feed)
        run: node --test

      - name: Build feeds
        run: node scripts/build-feed.mjs

      - name: Validate site & feeds (strict)
        run: node scripts/validate.mjs --strict

      - name: i18n dictionary check (strict)
        run: node scripts/check-i18n.mjs --strict

      - name: English comments check (strict)
        run: node scripts/check-comments.mjs --strict

      - name: Checker self-tests (i18n / comments)
        run: |
          node scripts/check-i18n.mjs --self-test
          node scripts/check-comments.mjs --self-test

      - name: Security check (strict)
        run: |
          node scripts/security-check.mjs --strict
          node scripts/security-check.mjs --self-test

      - name: Skill self-check (one-sentence-project)
        run: node skills/one-sentence-project/scripts/check-project.mjs --self

      - name: Skill scaffold smoke test
        run: |
          node skills/one-sentence-project/scripts/scaffold.mjs .skill-demo --name skill-demo --domain "LLM tracking"
          node skills/one-sentence-project/scripts/check-project.mjs --skeleton .skill-demo
          rm -rf .skill-demo
