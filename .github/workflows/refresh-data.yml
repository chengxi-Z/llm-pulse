name: Refresh data snapshot

on:
  schedule:
    # Write the latest data snapshot back to the repository every Monday at 10:23 (Beijing time) for local development
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "refresh-data"
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Refresh data (full sources)
        run: node scripts/fetch-data.mjs --mode=ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build feeds
        run: node scripts/build-feed.mjs

      - name: Validate
        run: node scripts/validate.mjs --strict

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/feed.xml site/feed.json
          if git diff --cached --quiet; then
            echo "::notice::数据无变化，跳过提交"
          else
            git commit -m "chore(data): refresh data snapshot"
            git push
          fi
